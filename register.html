<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | Welcome</title>

    <link rel="stylesheet" href="register.css" />
    <script src="register.js" defer></script>
  </head>

  <body>
    <main class="container">
      <section class="register-card">
        <div class="brand-icon" aria-hidden="true">✦</div>

        <h1>Create Account</h1>
        <p class="subtitle">Join us and start your journey today.</p>

        <form class="register-form" id="register-form" novalidate>
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <small class="field-hint">Use at least 8 characters.</small>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Enter your password again"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="toggle-confirm-password"
                aria-label="Show confirmation password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <label class="terms-label">
            <input type="checkbox" id="terms" required />
            <span>I agree to the Terms and Conditions.</span>
          </label>

          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit" class="register-button">Create Account</button>
        </form>

        <p class="login-text">
          Already have an account?
          <a href="login.html">Sign In</a>
        </p>

        <p class="security-note">✧ Your journey starts here.</p>
      </section>
    </main>
  </body>
</html>
